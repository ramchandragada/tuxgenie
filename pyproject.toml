[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuxgenie"
version = "6.90.0"
description = "AI-powered Linux assistant — fix any Linux problem in plain English"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = ["anthropic>=0.50.0"]

keywords = ["linux", "ai", "assistant", "claude", "terminal", "troubleshooter", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
tuxgenie = "tuxgenie:main"
tuxgenie-app = "tuxgenie_shell:main"

[project.urls]
Homepage    = "https://github.com/ramchandragada/tuxgenie"
Issues      = "https://github.com/ramchandragada/tuxgenie/issues"
Source      = "https://github.com/ramchandragada/tuxgenie"
Changelog   = "https://github.com/ramchandragada/tuxgenie/releases"

[tool.setuptools]
py-modules = ["tuxgenie", "tuxgenie_shell"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W"]
# Ignore purely-cosmetic pycodestyle codes: this single-file tool deliberately
# uses compact one-liners (def ok(msg): print(...)) and short status f-strings.
# All meaningful correctness checks (undefined names, unused vars/imports,
# redefinitions, f-string errors, bare-except, etc.) stay enabled.
ignore = [
    "E501",   # line-too-long (handled by line-length, long UI strings are fine)
    "E701",   # multiple statements on one line (colon) — intentional one-liners
    "E702",   # multiple statements on one line (semicolon) — intentional
    "E741",   # ambiguous variable name (l/O/I) — a few short-lived locals
    "E401",   # multiple imports on one line — intentional at the top
    "F541",   # f-string without placeholders — harmless in status messages
]
