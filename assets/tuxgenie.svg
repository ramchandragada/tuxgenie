<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1"   stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.3" cy="0.22" r="0.9">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24304F"/>
      <stop offset="1" stop-color="#0E1730"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6FF"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB13C"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6CC"/>
      <stop offset="1" stop-color="#FFD34A"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#gloss)"/>

  <!-- soft ground shadow -->
  <ellipse cx="256" cy="432" rx="132" ry="26" fill="#000000" opacity="0.18" filter="url(#soft)"/>

  <!-- flippers -->
  <ellipse cx="150" cy="300" rx="30" ry="86" fill="url(#body)" transform="rotate(18 150 300)"/>
  <ellipse cx="362" cy="300" rx="30" ry="86" fill="url(#body)" transform="rotate(-18 362 300)"/>

  <!-- body + head as one silhouette -->
  <ellipse cx="256" cy="312" rx="124" ry="132" fill="url(#body)"/>
  <circle  cx="256" cy="196" r="98" fill="url(#body)"/>

  <!-- belly -->
  <ellipse cx="256" cy="322" rx="80" ry="112" fill="url(#belly)"/>

  <!-- feet -->
  <ellipse cx="214" cy="436" rx="36" ry="17" fill="url(#beak)"/>
  <ellipse cx="298" cy="436" rx="36" ry="17" fill="url(#beak)"/>

  <!-- eyes -->
  <ellipse cx="222" cy="188" rx="30" ry="34" fill="#FFFFFF"/>
  <ellipse cx="290" cy="188" rx="30" ry="34" fill="#FFFFFF"/>
  <circle cx="230" cy="196" r="13" fill="#12203C"/>
  <circle cx="282" cy="196" r="13" fill="#12203C"/>
  <circle cx="234" cy="191" r="4.5" fill="#FFFFFF"/>
  <circle cx="286" cy="191" r="4.5" fill="#FFFFFF"/>

  <!-- beak -->
  <path d="M256 206 L286 228 L256 250 L226 228 Z" fill="url(#beak)"/>
  <path d="M256 228 L286 228 L256 250 L226 228 Z" fill="#E96A00" opacity="0.55"/>

  <!-- rosy cheeks -->
  <ellipse cx="196" cy="228" rx="15" ry="10" fill="#FF8FA3" opacity="0.55"/>
  <ellipse cx="316" cy="228" rx="15" ry="10" fill="#FF8FA3" opacity="0.55"/>

  <!-- magic sparkles (the 'genie') -->
  <g>
    <path d="M372 118 L384 150 L416 162 L384 174 L372 206 L360 174 L328 162 L360 150 Z" fill="url(#spark)"/>
    <circle cx="410" cy="120" r="9" fill="#FFE9A6"/>
    <circle cx="150" cy="150" r="7" fill="#FFE9A6"/>
    <path d="M138 96 L144 112 L160 118 L144 124 L138 140 L132 124 L116 118 L132 112 Z" fill="url(#spark)" opacity="0.9"/>
  </g>
</svg>
