name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is 26.04, which has no Python 3.9 builds.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install -r requirements.txt

      - name: Lint with ruff
        # Rule selection lives in pyproject.toml [tool.ruff.lint] — single source of truth.
        run: ruff check tuxgenie.py

      - name: Check syntax
        run: python -c "import ast; ast.parse(open('tuxgenie.py').read()); print('Syntax OK')"

      - name: Run tests
        run: pytest tests/ -v
