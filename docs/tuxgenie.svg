<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.45" stop-color="#0a5c66"/>
      <stop offset="1" stop-color="#062830"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#1ec8d4" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#1ec8d4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1ec8d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.14" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0.35" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="belly" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="beak" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e85d04"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#e85d04"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- squircle -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#glow)"/>
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#gloss)"/>

  <!-- subtle ember rim -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="none" stroke="#ff8a2a" stroke-opacity="0.18" stroke-width="3"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="430" rx="118" ry="22" fill="#000000" opacity="0.22" filter="url(#soft)"/>

  <!-- wings -->
  <path d="M148 286 C118 286 108 332 118 372 C128 392 148 398 158 360 C168 322 158 286 148 286 Z" fill="url(#body)"/>
  <path d="M364 286 C394 286 404 332 394 372 C384 392 364 398 354 360 C344 322 354 286 364 286 Z" fill="url(#body)"/>

  <!-- body -->
  <ellipse cx="256" cy="318" rx="118" ry="128" fill="url(#body)"/>
  <circle cx="256" cy="198" r="94" fill="url(#body)"/>

  <!-- belly -->
  <ellipse cx="256" cy="326" rx="72" ry="104" fill="url(#belly)"/>

  <!-- feet -->
  <ellipse cx="214" cy="434" rx="34" ry="15" fill="url(#beak)"/>
  <ellipse cx="298" cy="434" rx="34" ry="15" fill="url(#beak)"/>

  <!-- eyes -->
  <ellipse cx="220" cy="186" rx="28" ry="32" fill="#ffffff"/>
  <ellipse cx="292" cy="186" rx="28" ry="32" fill="#ffffff"/>
  <circle cx="228" cy="194" r="12" fill="#0b1220"/>
  <circle cx="284" cy="194" r="12" fill="#0b1220"/>
  <circle cx="232" cy="188" r="4.2" fill="#ffffff"/>
  <circle cx="288" cy="188" r="4.2" fill="#ffffff"/>

  <!-- beak -->
  <path d="M256 206 L284 226 L256 246 L228 226 Z" fill="url(#beak)"/>
  <path d="M256 226 L284 226 L256 246 L228 226 Z" fill="#c2410c" opacity="0.45"/>

  <!-- teal tech ring (genie) -->
  <circle cx="256" cy="198" r="118" fill="none" stroke="#1ec8d4" stroke-opacity="0.22" stroke-width="4"/>
  <path d="M372 112 L382 138 L408 148 L382 158 L372 184 L362 158 L336 148 L362 138 Z" fill="url(#ember)"/>
  <circle cx="404" cy="118" r="7" fill="#ff8a2a" opacity="0.95"/>
  <circle cx="142" cy="142" r="5" fill="#1ec8d4" opacity="0.9"/>
</svg>
